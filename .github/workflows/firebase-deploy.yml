name: Deploy Firebase Functions (FCM Push)

on:
  push:
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-deploy.yml'
      - 'firebase.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependências das funções
        working-directory: ./functions
        run: npm install

      - name: Compilar TypeScript
        working-directory: ./functions
        run: npx tsc

      - name: Autenticar no Firebase (via service account)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase --version

      - name: Deploy Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        working-directory: ./functions
        run: firebase deploy --only functions --project cardapio-8ddea --non-interactive
